<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhyNutt Studio</title>
    <!-- Import Nunito Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Base reset */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      /* Main layout mimicking the game's clean UI */
      body {
        font-family: "Nunito", sans-serif;
        font-weight: 400;
        background-color: #faf9f6; /* Off-white background */
        color: #2c3e50; /* Dark slate text */
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        align-items: center;
        text-align: center;
      }

      header {
        padding: 50px 20px 20px;
      }

      h1 {
        color: #56a754; /* Game's primary green */
        font-size: 2.5rem;
        margin-bottom: 10px;
        font-weight: 700;
      }

      p {
        font-size: 1.1rem;
        margin-bottom: 20px;
        color: #4a5568;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        width: 100%;
      }

      /* Button styles based on screenshots (pill-shaped) */
      .btn-container {
        display: flex;
        flex-direction: column;
        gap: 15px;
        width: 100%;
        max-width: 300px;
      }

      .btn {
        background-color: #56a754;
        color: white;
        text-decoration: none;
        padding: 15px 20px;
        border-radius: 30px;
        font-size: 1.2rem;
        font-weight: bold;
        border: none;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .btn:hover {
        opacity: 0.9;
      }

      .btn-outline {
        background-color: transparent;
        color: #2c3e50;
        border: 1px solid #718096;
      }

      .btn-outline:hover {
        background-color: #edf2f7;
      }

      footer {
        padding: 20px;
        width: 100%;
        font-size: 0.9rem;
      }
      footer a {
        color: #56a754;
        text-decoration: none;
        font-weight: bold;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>WhyNutt Studio</h1>
      <p>Engaging mobile puzzle games.</p>
    </header>
    <main>
      <div class="btn-container">
        <!-- Links matching game UI style -->
        <a
          href="https://play.google.com/store/apps/developer?id=WhyNutt+Studio"
          class="btn"
          >Our Games</a
        >
        <a href="privacy.html" class="btn btn-outline">Privacy Policy</a>
      </div>
    </main>
    <footer>
      <p>&copy; 2026 WhyNutt Studio. All rights reserved.</p>
      <p><a href="privacy.html">Privacy Policy</a></p>
    </footer>
  </body>
</html>
